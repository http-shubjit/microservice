server.port=8081

# ── H2 ───────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console → http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# add these lines to existing properties
springdoc.api-docs.path=/auth/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html   
springdoc.api-docs.enabled=true

# ── JWT — must match gateway secret exactly ───────────────────────────────────
app.jwt.secret=3d6f45a5fc12445dbac2f59c3b6c7cb1d6f45a5fc12445dbac2f59c3b6c7cb1
app.jwt.expiration.ms=86400000