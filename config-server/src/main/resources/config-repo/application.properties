# ===================================================================
# GLOBAL LOGGING LEVELS
# ===================================================================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG

# ===================================================================
# GLOBAL key to validate request comes from apigateway or not
# 
app.internal.secret=MySuperSecretInternalKey@123


# ===================================================================
# GATEWAY URL (for Swagger doc generation)
# ===================================================================
app.gateway.url=http://localhost:8080

# ===================================================================
# REDIS
# ===================================================================
spring.data.redis.host=innocent-hyena-147929.upstash.io
spring.data.redis.password=gQAAAAAAAmXlAAIgcDE4MjhjYWZjMGM4NmM0ODIxOGVlNGMyYTMzM2FkNTMzNA
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=true

# ===================================================================
# EUREKA REGISTRATION
# ===================================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

# ===================================================================
# ACTUATOR & HEALTH PROBES (Global baseline)
# ===================================================================
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true