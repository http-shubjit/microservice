# ===================================================================
# GLOBAL LOGGING LEVELS (Inherited by all services)
# ===================================================================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG

# Base gateway routing address used for documentation generation
app.gateway.url=http://localhost:8080

# ===================================================================
# GLOBAL EUREKA REGISTRATION DESIGN (Inherited by all services)
# ===================================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${spring.cloud.client.ip-address}
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.ip-address}:${server.port}

# ===================================================================
# SAFE GLOBAL ACTUATOR EXPOSURE
# ===================================================================
# 1. Sabhi services ke liye Actuator Health exposed hona chahiye
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# in every services Readiness/Liveness Probes ko explicitly enable karna hoga, kyunki ye by default disabled hote hain
# if we will not enable then whe api gateway cal to /actuator/health/readiness will give  504 servicenot available error even if the service is up and running
management.endpoint.health.probes.enabled=true
