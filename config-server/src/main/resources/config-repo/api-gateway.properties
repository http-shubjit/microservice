# ===================================================================
# SERVER FOOTPRINT
# ===================================================================
server.port=8080

# ===================================================================
# SWAGGER / OPENAPI CONFIGURATION
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.disable-swagger-default-url=true

springdoc.swagger-ui.urls[0].name=auth-server
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=data-service
springdoc.swagger-ui.urls[1].url=/data/v3/api-docs

# ===================================================================
# GATEWAY TUNING & TIMEOUTS
# ===================================================================
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# ===================================================================
# REDIS CORE CONFIGURATION
# ===================================================================
spring.data.redis.host=innocent-hyena-147929.upstash.io
spring.data.redis.password=gQAAAAAAAkHZAAIgcDFjMTAwYzkyNTEwNWE0NzgwYTQxOTYxYWI4ZGQ3ZDUwZQ
spring.data.redis.port=6379 
spring.data.redis.ssl.enabled=true

