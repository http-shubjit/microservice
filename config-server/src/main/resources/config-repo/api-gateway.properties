# ===================================================================
# GATEWAY ROUTING MATRIX (Sequential 0 to 5)
# ===================================================================

# ROUTE 0 : AUTH SERVICE SWAGGER DOCS
spring.cloud.gateway.server.webflux.routes[0].id=auth-docs
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-server
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/v3/api-docs

# ROUTE 1 : DATA SERVICE SWAGGER DOCS
spring.cloud.gateway.server.webflux.routes[1].id=data-docs
spring.cloud.gateway.server.webflux.routes[1].uri=lb://data-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/data/v3/api-docs

# ROUTE 2 : AUTH SERVICE APIs
spring.cloud.gateway.server.webflux.routes[2].id=auth-server
spring.cloud.gateway.server.webflux.routes[2].uri=lb://auth-server
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.server.webflux.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.name=authCircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.fallbackUri=forward:/fallback/auth-down

# ROUTE 3 : EXCLUSIVE SYSTEM ADMINISTRATOR TOOLS
spring.cloud.gateway.server.webflux.routes[3].id=data-admin-only
spring.cloud.gateway.server.webflux.routes[3].uri=lb://data-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/admin/**
spring.cloud.gateway.server.webflux.routes[3].filters[0].name=AuthFilter
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.requiredRole=SYSTEM_ADMINISTRATOR
spring.cloud.gateway.server.webflux.routes[3].filters[1].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[3].filters[1].args.name=dataCircuitBreaker
spring.cloud.gateway.server.webflux.routes[3].filters[1].args.fallbackUri=forward:/fallback/data-down

# ====================================================================
# ROUTE 4 : EXCLUSIVE PUBLIC ENDPOINTS (Moved to run BEFORE the catch-all)
# Completely open to unauthenticated guests (No AuthFilter attached).
# ====================================================================
spring.cloud.gateway.server.webflux.routes[4].id=data-public-endpoints
spring.cloud.gateway.server.webflux.routes[4].uri=lb://data-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/public/**
spring.cloud.gateway.server.webflux.routes[4].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[4].filters[0].args.name=dataCircuitBreaker
spring.cloud.gateway.server.webflux.routes[4].filters[0].args.fallbackUri=forward:/fallback/data-down

# ====================================================================
# ROUTE 5 : SECURE CATCH-ALL (Merged old routes 4 & 6)
# Catches anything else under /api/v1/ that didn't match the routes above.
# ====================================================================
spring.cloud.gateway.server.webflux.routes[5].id=data-shared-records
spring.cloud.gateway.server.webflux.routes[5].uri=lb://data-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/**
spring.cloud.gateway.server.webflux.routes[5].filters[0].name=AuthFilter
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.requiredRole=USER
spring.cloud.gateway.server.webflux.routes[5].filters[1].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[5].filters[1].args.name=dataCircuitBreaker
spring.cloud.gateway.server.webflux.routes[5].filters[1].args.fallbackUri=forward:/fallback/data-down


# ROUTE 6 : SANDBOX PAYMENT PAGE ROUTING
# Forwards the static checkout layout directly from the underlying data-service instance.
spring.cloud.gateway.server.webflux.routes[6].id=data-payment
spring.cloud.gateway.server.webflux.routes[6].uri=lb://data-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/payment.html

# ===================================================================
# RESILIENCE4J - CIRCUIT BREAKERS
# ===================================================================
resilience4j.circuitbreaker.instances.dataCircuitBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.dataCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.dataCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.dataCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.dataCircuitBreaker.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.dataCircuitBreaker.slowCallDurationThreshold=10s
resilience4j.circuitbreaker.instances.dataCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.dataCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.dataCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.dataCircuitBreaker.ignoreExceptions[0]=org.springframework.web.server.ResponseStatusException

resilience4j.circuitbreaker.instances.authCircuitBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.authCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.authCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.authCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.authCircuitBreaker.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.authCircuitBreaker.slowCallDurationThreshold=10s
resilience4j.circuitbreaker.instances.authCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.authCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.authCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.authCircuitBreaker.ignoreExceptions[0]=org.springframework.web.server.ResponseStatusException

